services:
  backend:
    image: ghcr.io/felikowski/finops-backend:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - /etc/finops/prod/infisical.env
    environment:
      SECRETS_SOURCE: infisical
      PUBLIC_API_BASE_URL: /api
    networks:
      - default

  frontend:
    image: ghcr.io/felikowski/finops-frontend:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - root_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.routers.finops.rule=Host(`finops.srv1115517.hstgr.cloud`)
      - traefik.http.routers.finops.entrypoints=websecure
      - traefik.http.routers.finops.tls.certresolver=mytlschallenge
      - traefik.http.services.finops.loadbalancer.server.port=80

networks:
  root_default:
    external: true
