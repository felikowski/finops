services:
  backend:
    image: ghcr.io/felikowski/finops-backend:main
    restart: unless-stopped
    env_file:
      - /etc/finops/dev/infisical.env
    environment:
      SECRETS_SOURCE: infisical
      PUBLIC_API_BASE_URL: /api
    networks:
      - default

  frontend:
    image: ghcr.io/felikowski/finops-frontend:main
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - root_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.routers.finops-staging.rule=Host(`finops-staging.srv1115517.hstgr.cloud`)
      - traefik.http.routers.finops-staging.entrypoints=websecure
      - traefik.http.routers.finops-staging.tls.certresolver=mytlschallenge
      - traefik.http.services.finops-staging.loadbalancer.server.port=80

networks:
  root_default:
    external: true
