name: Promote release images

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      ref_sha:
        description: "Commit SHA whose already-published sha- image to promote (defaults to the triggering commit)"
        required: false
        type: string
      version:
        description: "Plain semver being released, e.g. 1.4.0 (defaults to parsing it from the pushed tag)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  promote:
    # push events never fire with a fork's write-scoped token against this
    # repo's packages, but keep the guard explicit rather than implicit.
    if: github.repository == 'felikowski/finops'
    name: Promote ${{ matrix.image }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            ghcr_repo: ghcr.io/felikowski/finops-backend
          - image: frontend
            ghcr_repo: ghcr.io/felikowski/finops-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action derives the version from the ref that triggered
      # this *workflow run* — correct for a direct tag push, but wrong when
      # called via workflow_call, where the ref is still the caller's (main).
      # Build the tags directly from the version instead, so both paths agree.
      - name: Determine release version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a plain semver (expected e.g. 1.4.0)"
            exit 1
          fi
          echo "full=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$version" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Verify the source image was already built from main
        env:
          SOURCE: ${{ matrix.ghcr_repo }}:sha-${{ inputs.ref_sha || github.sha }}
        run: |
          if ! docker buildx imagetools inspect "$SOURCE" >/dev/null 2>&1; then
            echo "::error::$SOURCE not found in GHCR — this tag's commit was never built and published from main, so there is nothing to promote."
            exit 1
          fi

      - name: Promote existing image to release tags (no rebuild)
        env:
          SOURCE: ${{ matrix.ghcr_repo }}:sha-${{ inputs.ref_sha || github.sha }}
          FULL_TAG: ${{ matrix.ghcr_repo }}:${{ steps.version.outputs.full }}
          MINOR_TAG: ${{ matrix.ghcr_repo }}:${{ steps.version.outputs.minor }}
        run: |
          docker buildx imagetools create --tag "$FULL_TAG" --tag "$MINOR_TAG" "$SOURCE"
