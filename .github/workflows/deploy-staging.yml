name: Deploy to staging

on:
  workflow_run:
    workflows: ["Publish container images"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy if the images we're about to pull actually got published.
    if: github.event.workflow_run.conclusion == 'success'
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.STAGING_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy staging compose file
        run: |
          scp -i ~/.ssh/id_ed25519 deploy/staging/docker-compose.yml \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:/docker/finops/docker-compose.yml"

      - name: Pull and restart staging stack
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            "docker compose -f /docker/finops/docker-compose.yml pull && docker compose -f /docker/finops/docker-compose.yml up -d"
