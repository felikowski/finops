name: Promote release to production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Already-released semver to deploy to prod, e.g. 0.1.0 (must exist as a v<version> GitHub Release)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${{ inputs.version }}' is not a plain semver (expected e.g. 0.1.0, no leading v)"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Verify released images exist in GHCR
        run: |
          for image in finops-backend finops-frontend; do
            ref="ghcr.io/felikowski/$image:${{ inputs.version }}"
            if ! docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "::error::$ref not found — version ${{ inputs.version }} was never cut via the 'Cut a release' workflow, so there is nothing to promote to prod."
              exit 1
            fi
          done

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy prod compose file
        run: |
          scp -i ~/.ssh/id_ed25519 deploy/prod/docker-compose.yml \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/docker/finops-prod/docker-compose.yml"

      - name: Pull and restart prod stack at the pinned version
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            "export IMAGE_TAG=${{ inputs.version }} && \
             docker compose -f /docker/finops-prod/docker-compose.yml pull && \
             docker compose -f /docker/finops-prod/docker-compose.yml up -d"
