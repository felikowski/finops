name: Cut a release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release, e.g. 1.4.0 (no leading v)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tag:
    name: Create and push release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${{ inputs.version }}' is not a plain semver (expected e.g. 1.4.0, no leading v)"
            exit 1
          fi

      # Always release main's current tip, regardless of which ref this was
      # dispatched against, so a release is always "everything merged so far".
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check tag does not already exist
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ inputs.version }}" >/dev/null; then
            echo "::error::Tag v${{ inputs.version }} already exists"
            exit 1
          fi

      - id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      # A tag is just a pointer — it has no changelog of its own. A GitHub
      # Release with auto-generated notes gives that for free (PR titles/
      # authors since the previous tag), without us maintaining a changelog.
      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes

  promote:
    name: Promote images for this release
    needs: tag
    permissions:
      contents: read
      packages: write
    # A push made with the default GITHUB_TOKEN (the "Create and push tag"
    # step above) does NOT trigger other workflows' `push` events — that's
    # GitHub's built-in loop-prevention. promote-release.yml's own
    # `push: tags:` trigger only fires for tags pushed some other way (e.g. a
    # human with their own credentials). Calling it directly here is what
    # makes the release we just tagged actually get promoted.
    uses: ./.github/workflows/promote-release.yml
    with:
      ref_sha: ${{ needs.tag.outputs.sha }}
      version: ${{ inputs.version }}
