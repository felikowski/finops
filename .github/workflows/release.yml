name: Cut a release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release, e.g. 1.4.0 (no leading v)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tag:
    name: Create and push release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${{ inputs.version }}' is not a plain semver (expected e.g. 1.4.0, no leading v)"
            exit 1
          fi

      # Always release main's current tip, regardless of which ref this was
      # dispatched against, so a release is always "everything merged so far".
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check tag does not already exist
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ inputs.version }}" >/dev/null; then
            echo "::error::Tag v${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      # A tag is just a pointer — it has no changelog of its own. A GitHub
      # Release with auto-generated notes gives that for free (PR titles/
      # authors since the previous tag), without us maintaining a changelog.
      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes
